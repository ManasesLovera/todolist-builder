# Minimal single-binary Loki config for local docker-compose use only.
# Filesystem storage, no replication, no auth -- not suitable for production.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# TSDB is the current recommended index type (boltdb-shipper is the legacy
# equivalent); either works for a single-node dev setup like this one.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Retention is not meaningful for a training/dev tool; kept short (7 days)
  # purely so disk usage doesn't grow unbounded across a long-running demo.
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://localhost:9093
