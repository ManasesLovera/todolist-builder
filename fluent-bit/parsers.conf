# Parsers for the observability pipeline described in DESIGN.md Section 3:
# Next.js (JSON logs to stdout) -> Fluent Bit -> Loki.

# Parses the outer envelope Docker's json-file log driver wraps every stdout/
# stderr line in, e.g.:
#   {"log":"{\"level\":\"info\",\"msg\":\"...\"}\n","stream":"stdout","time":"2026-07-29T12:00:00.123456789Z"}
# This is the standard "docker" parser definition Fluent Bit itself ships by
# default; it's redeclared here so this config doesn't depend on the image's
# built-in parsers.conf.
[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

# Parses the Next.js app's own structured JSON log line -- the content left
# in the `log` field after the `docker` parser above strips the envelope.
# DESIGN.md Section 3 specifies single-line JSON to stdout (deliberately mixed
# with malformed/inconsistent shapes for the bug catalog), so no Time_Key is
# assumed here: the app's exact field names aren't fixed yet, and lines that
# fail to parse as JSON are simply left as raw text by the filter that uses
# this parser (Reserve_Data On), not dropped.
[PARSER]
    Name        json_app
    Format      json
