[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# Tail Docker's json-file log driver output. Docker writes one file per
# container at /var/lib/docker/containers/<container_id>/<container_id>-json.log,
# keyed by the container's full ID (assigned at `docker compose up` time) --
# there's no way to glob just the `web` service ahead of time by compose
# service name. In this stack that path also picks up postgres/loki/grafana/
# fluent-bit's own container logs; for a small dev/training stack that's
# fine, since the JSON parser below simply passes through anything that
# isn't valid JSON (i.e. non-app logs) unparsed rather than erroring.
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Path_Key          filepath
    Exclude_Path      /var/lib/docker/containers/*/*-json.log.gz
    Tag               docker.*
    Parser            docker
    Docker_Mode       On
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On

# The Next.js app (DESIGN.md Section 3) logs single-line JSON to stdout.
# After the `docker` parser (applied by the tail input above) strips Docker's
# envelope, the app's original line is left as a string in the `log` field --
# parse that as JSON too so structured fields (level, msg, requestId, etc.)
# become first-class record keys instead of an opaque string. Reserve_Data
# keeps the surrounding docker fields (stream, time, filepath) either way, and
# lines that aren't valid JSON (stray console output, or non-Next.js
# containers' logs) are left as-is rather than dropped.
[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        json_app
    Reserve_Data  On

# Output: forward to Loki's push API.
#
# We use Fluent Bit's built-in `loki` output plugin rather than a generic
# `http` output hand-configured for Loki's push API. The `loki` plugin has
# been bundled in stock Fluent Bit since v1.8 (well within the current stable
# `fluent/fluent-bit` image used above), and handles the things a raw `http`
# output would otherwise require re-implementing by hand: batching records
# into Loki's expected streams/values JSON shape, converting selected record
# keys into Loki labels via Label_Keys, and computing the /loki/api/v1/push
# URI from Host/Port. That makes it the more standard and reliable choice for
# a current Fluent Bit image; a raw `http` output is really only a fallback
# for older Fluent Bit builds that predate the plugin.
#
# Container identity: the tail input's Path_Key above captures the full
# tailed file path (which embeds the container's ID) into the `filepath`
# field on every record; Label_Keys promotes it to a Loki label. Resolving
# that ID to a human-friendly container *name* would require querying the
# Docker Engine API, which is why /var/run/docker.sock is mounted into this
# container in docker-compose.yml -- but stock Fluent Bit has no bundled
# filter that performs that lookup for plain (non-Kubernetes) Docker hosts,
# so this config does not use the socket yet. Until the app defines a stable
# log schema of its own (e.g. a `service` field), use the `filepath` label or
# the presence of parsed JSON fields to pick the web app's logs out of Loki.
[OUTPUT]
    Name          loki
    Match         docker.*
    Host          loki
    Port          3100
    Labels        job=docker, pipeline=fluent-bit
    Label_keys    $filepath
    Line_format   json
